    function computeAccess(stu) {
      const startStr = stu.accessStartDate || new Date().toISOString().slice(0, 10);
      const start = new Date(startStr + 'T00:00:00');
      const daysElapsed = Math.max(0, Math.floor((Date.now() - start.getTime()) / 86400000));
      const daysRemaining = Math.max(0, 45 - daysElapsed);
      const exp = new Date(start.getTime() + 45 * 86400000).toISOString().slice(0, 10);
      return { startStr, exp, daysRemaining, isExpired: Boolean(stu.forceLocked) || daysElapsed >= 45 };
    }

    function computeStats(stu) {
      let done = 0, fullDays = 0;
      const perTab = { aj:0, friends:0, vocabs:0, quizzes:0, pronunciation:0, conversation:0 };
      for (let d = 1; d <= 30; d++) {
        let dc = 0;
        SKILL_TABS.forEach(t => {
          if (stu.days && stu.days[d] && stu.days[d][t.id] && stu.days[d][t.id].completed) {
            done++; dc++; perTab[t.id]++;
          }
        });
        if (dc === 6) fullDays++;
      }
      return { done, left: 180 - done, pct: Math.round((done/180)*100), fullDays, needed90: Math.max(0, 162 - done), perTab };
    }

    window.doStudentLogin = function(e) {

      const idVal = (document.getElementById('loginId').value || '').trim();

      const digits = idVal.replace(/\D/g, '');
      const low = idVal.toLowerCase();
      const found = students.find(s => {
        const sp = String(s.phone||'').replace(/\D/g,'');
        return (digits.length>=6 && sp.endsWith(digits)) ||
               String(s.username||'').toLowerCase() === low ||
               String(s.email||'').toLowerCase() === low ||
               (low.length>=3 && String(s.name||'').toLowerCase().includes(low));
      });
      if (!found) { loginError = 'Account not found. Check your Phone, Email, Username, or Name.'; render(); return; }
      if (String(found.password||'123456').trim() !== passVal) { loginError = 'Incorrect password.'; render(); return; }
      const acc = computeAccess(found);
      if (acc.isExpired) {

      session = { role: 'student', studentId: found.id };
      saveLocal(); render();

      if (!stu.days[day]) stu.days[day] = {};
      const prev = stu.days[day][tabId] || {};
      const next = !prev.completed;
      stu.days[day][tabId] = { completed: next, note: next ? 'Checked by student' : '', verifiedAt: new Date().toISOString().slice(0,10) };
      saveLocal(); syncCloud({ student: stu }); render();
    };

                <div class="bg-[#162336] text-white p-4 rounded-2xl flex flex-col justify-between">
                  <div class="text-xs font-black text-amber-300">Level ${stu.level} • ${acc.daysRemaining} Days Left</div>
                  <button onclick="activeTab='bank';render()" class="mt-2 py-2 rounded-xl bg-amber-400 text-[#162336] text-xs font-black">📂 Open بنك الماتريال (Level ${stu.level}) →</button>
                </div>
              </div>
              <div class="bg-white rounded-2xl shadow border-2 border-[#162336] overflow-x-auto">
                <table class="w-full text-xs text-left border-collapse">
                  <thead class="bg-[#162336] text-white font-black">
                    <tr>
                      <th class="p-3">Day</th>
                      ${SKILL_TABS.map(t => `<th class="p-3 text-center">${t.label} (${st.perTab[t.id]}/30)</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody class="divide-y">
                    ${Array.from({length:30},(_,i)=>i+1).map(d => `
                      <tr>
                        <td class="p-3 font-black bg-slate-50">Day ${d}</td>
                        ${SKILL_TABS.map(t => {
                          const c = stu.days && stu.days[d] && stu.days[d][t.id] && stu.days[d][t.id].completed;
                          return `<td onclick="toggleCell(${d},'${t.id}')" class="p-2.5 text-center cursor-pointer ${c?'bg-emerald-50':'hover:bg-slate-100'}">
                            <div class="w-7 h-7 mx-auto rounded-lg flex items-center justify-center border-2 font-black ${c?'bg-[#10B981] border-[#10B981] text-white':'bg-white border-slate-300 text-transparent'}">✓</div>
                          </td>`;
                        }).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </main>`;
        return;
      }

      // Coach View
      root.innerHTML = `
        <header class="bg-[#162336] text-white p-4 flex items-center justify-between">
          <h1 class="font-black">TLC Academy — Coach Portal (45-Day Access & 30-Day Progress)</h1>
          <button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-[#CC171D] text-xs font-black">Log Out</button>
        </header>
        <main class="max-w-6xl mx-auto p-4 space-y-6">
          <form onsubmit="addStudentCoach(event)" class="bg-white p-4 rounded-2xl border grid grid-cols-1 sm:grid-cols-6 gap-2 text-xs">
            <input id="nsName" required placeholder="Full Name *" class="px-3 py-2 border rounded-xl font-bold" />
            <input id="nsPhone" required placeholder="Phone (010...) *" class="px-3 py-2 border rounded-xl font-bold" />
            <input id="nsEmail" placeholder="Email" class="px-3 py-2 border rounded-xl font-bold" />
            <input id="nsUser" placeholder="Username (Auto)" class="px-3 py-2 border rounded-xl font-bold" />
            <input id="nsPass" value="123456" placeholder="Password *" class="px-3 py-2 border rounded-xl font-bold" />
            <select id="nsLevel" class="px-3 py-2 border rounded-xl font-black">${TLC_LEVELS.map(l=>`<option>${l}</option>`).join('')}</select>
            <button type="submit" class="sm:col-span-6 py-2.5 rounded-xl bg-[#10B981] text-white font-black">+ Add Student (100% Blank 30-Day Sheet + 45-Day Access)</button>
          </form>
          <div class="bg-white rounded-2xl border overflow-x-auto">
            <table class="w-full text-xs text-left">
              <thead class="bg-[#162336] text-white font-black">
                <tr><th class="p-3">Phone</th><th class="p-3">Name & Email</th><th class="p-3">User / Pass</th><th class="p-3">Level</th><th class="p-3">45-Day Status</th><th class="p-3">30-Day Progress</th></tr>
              </thead>
              <tbody class="divide-y">
                ${students.map(s => {
                  const st = computeStats(s);
                  const acc = computeAccess(s);
                  return `<tr>
                    <td class="p-3 font-mono font-black text-[#CC171D]">${s.phone}</td>
                    <td class="p-3 font-bold">${s.name}<div class="text-[10px] text-slate-400">${s.email}</div></td>
                    <td class="p-3 font-mono">${s.username} / <strong>${s.password}</strong></td>
                    <td class="p-3 font-black">${s.level} Only</td>
                    <td class="p-3 font-black ${acc.isExpired?'text-red-600':'text-emerald-700'}">${acc.isExpired?'LOCKED':acc.daysRemaining+'d left'}</td>
                    <td class="p-3 font-black">${st.pct}% (${st.done}/180)</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </main>`;
    }
    render();
  </script>
</body>
</html>
